name: Queue Winget Directory

on:
  workflow_dispatch:
    inputs:
      manifest_root:
        description: "Winget manifest path or GitHub URL, such as manifests/1/123/123pan or https://github.com/microsoft/winget-pkgs/tree/master/manifests/1/123/123pan"
        required: true
        default: "manifests/1/123/123pan"
      ref:
        description: "winget-pkgs branch or ref"
        required: false
        default: "master"

concurrency:
  group: meta-write
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout binsentinel repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r watcher/requirements.txt

      - name: Normalize winget manifest input
        shell: bash
        run: |
          set -euo pipefail

          raw="${{ github.event.inputs.manifest_root }}"
          normalized="${raw//\\//}"
          prefix="https://github.com/microsoft/winget-pkgs/tree/"

          if [[ "$normalized" == "$prefix"* ]]; then
            normalized="${normalized#"$prefix"}"
            normalized="${normalized#*/}"
          fi

          normalized="${normalized#/}"
          normalized="${normalized%/}"

          if [[ "$normalized" != manifests/* ]]; then
            echo "manifest_root must point under manifests/: $raw" >&2
            exit 1
          fi

          echo "NORMALIZED_MANIFEST_ROOT=$normalized" >> "$GITHUB_ENV"

      - name: Clone meta repository
        run: |
          git clone \
            "https://x-access-token:${{ secrets.META_REPO_TOKEN }}@github.com/${{ secrets.META_REPO }}.git" \
            meta

      - name: Sparse clone target winget directory
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --filter=blob:none --sparse \
            --branch "${{ github.event.inputs.ref }}" \
            https://github.com/microsoft/winget-pkgs.git \
            winget-pkgs

          git -C winget-pkgs sparse-checkout set "${NORMALIZED_MANIFEST_ROOT}"

      - name: Queue tasks from manifest directory
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(git -C winget-pkgs rev-parse HEAD)"
          python scripts/queue_winget_dir.py meta \
            --winget-repo-path winget-pkgs \
            --manifest-root "${NORMALIZED_MANIFEST_ROOT}" \
            --sha "$SHA"

      - name: Push meta updates
        shell: bash
        run: |
          set -euo pipefail

          cd meta
          git config user.email "binsentinel-bot@users.noreply.github.com"
          git config user.name "BinSentinel Bot"
          git add -A

          if git diff --staged --quiet; then
            echo "No changes detected; skipping commit."
            exit 0
          fi

          branch="$(git branch --show-current || true)"
          if [[ -z "$branch" ]]; then
            branch="$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's@^origin/@@')"
          fi

          git commit -m "chore(winget-manual): queue ${NORMALIZED_MANIFEST_ROOT} [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git rebase "origin/$branch"

            if git push origin "HEAD:$branch"; then
              exit 0
            fi

            echo "Push raced with another update, retrying ($attempt/3)."
          done

          echo "Failed to push meta updates after 3 attempts."
          exit 1
