name: Queue Winget Directory

on:
  workflow_dispatch:
    inputs:
      manifest_root:
        description: 'winget 目录，如 manifests/1/123/123pan 或 manifests/1/123/123pan/1.0.0'
        required: true
        default: 'manifests/1/123/123pan'
      ref:
        description: 'winget-pkgs 分支或 ref'
        required: false
        default: 'master'

concurrency:
  group: meta-write
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest

    steps:
      - name: 检出 binsentinel 代码仓库
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install -r watcher/requirements.txt

      - name: 克隆元数据仓库
        run: |
          git clone \
            "https://x-access-token:${{ secrets.META_REPO_TOKEN }}@github.com/${{ secrets.META_REPO }}.git" \
            meta

      - name: 稀疏克隆目标 winget 目录
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --filter=blob:none --sparse \
            --branch "${{ github.event.inputs.ref }}" \
            https://github.com/microsoft/winget-pkgs.git \
            winget-pkgs

          git -C winget-pkgs sparse-checkout set "${{ github.event.inputs.manifest_root }}"

      - name: 扫描目录并写入任务
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(git -C winget-pkgs rev-parse HEAD)"
          python scripts/queue_winget_dir.py meta \
            --winget-repo-path winget-pkgs \
            --manifest-root "${{ github.event.inputs.manifest_root }}" \
            --sha "$SHA"

      - name: 推送元数据变更
        shell: bash
        run: |
          set -euo pipefail

          cd meta
          git config user.email "binsentinel-bot@users.noreply.github.com"
          git config user.name "BinSentinel Bot"
          git add -A

          if git diff --staged --quiet; then
            echo "无变更，跳过提交。"
            exit 0
          fi

          branch="$(git branch --show-current || true)"
          if [[ -z "$branch" ]]; then
            branch="$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's@^origin/@@')"
          fi
          git commit -m "chore(winget-manual): queue ${{ github.event.inputs.manifest_root }} [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git rebase "origin/$branch"

            if git push origin "HEAD:$branch"; then
              exit 0
            fi

            echo "推送与其他更新发生竞争，重试中 ($attempt/3)。"
          done

          echo "重试 3 次后仍无法推送元数据变更。"
          exit 1
