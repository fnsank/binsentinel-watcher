name: Historical Backfill

on:
  workflow_dispatch:
    inputs:
      since:
        description: Start date in YYYY-MM-DD format (inclusive). Leave empty for earliest history.
        required: false
        default: ''
      until:
        description: End date in YYYY-MM-DD format (inclusive). Leave empty for today.
        required: false
        default: ''

concurrency:
  group: meta-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout watcher repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r watcher/requirements.txt

      - name: Clone meta repository
        run: |
          git clone \
            "https://x-access-token:${{ secrets.META_REPO_TOKEN }}@github.com/${{ secrets.META_REPO }}.git" \
            meta

      - name: Cache ScoopInstaller/Main
        uses: actions/cache@v4
        with:
          path: scoop-main-cache
          key: scoop-main-${{ github.run_id }}
          restore-keys: |
            scoop-main-

      - name: Run historical backfill
        shell: bash
        run: |
          set -euo pipefail

          args=(meta --bucket-cache scoop-main-cache)

          if [ -n "${{ github.event.inputs.since }}" ]; then
            args+=(--since "${{ github.event.inputs.since }}")
          fi

          if [ -n "${{ github.event.inputs.until }}" ]; then
            args+=(--until "${{ github.event.inputs.until }}")
          fi

          python scripts/backfill.py "${args[@]}"

      - name: Push meta updates
        shell: bash
        run: |
          set -euo pipefail

          cd meta
          git config user.email "binsentinel-bot@users.noreply.github.com"
          git config user.name "BinSentinel Bot"
          git add -A

          if git diff --staged --quiet; then
            echo "No new tasks detected, skipping commit."
            exit 0
          fi

          git commit -m "chore(backfill): historical tasks ${{ github.event.inputs.since }}~${{ github.event.inputs.until }} [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin
            if git rebase origin/main && git push; then
              exit 0
            fi

            echo "Push failed, retrying ($attempt/3)..."
            sleep 5
          done

          echo "Failed to push meta updates after 3 attempts."
          exit 1
