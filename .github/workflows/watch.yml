name: Scoop Watcher

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: meta-write
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout watcher repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r watcher/requirements.txt

      - name: Clone meta repository
        run: |
          git clone \
            "https://x-access-token:${{ secrets.META_REPO_TOKEN }}@github.com/${{ secrets.META_REPO }}.git" \
            meta

      - name: Run watcher
        env:
          GITHUB_TOKEN: ${{ secrets.SCOOP_GITHUB_TOKEN }}
          PYTHONPATH: .
        run: python -m watcher.check_updates meta

      - name: Push meta updates
        shell: bash
        run: |
          set -euo pipefail

          cd meta
          git config user.email "binsentinel-bot@users.noreply.github.com"
          git config user.name "BinSentinel Bot"
          git add -A

          if git diff --staged --quiet; then
            echo "No changes detected, skipping commit."
            exit 0
          fi

          branch="$(git branch --show-current || true)"
          if [[ -z "$branch" ]]; then
            branch="$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's@^origin/@@')"
          fi
          git commit -m "chore(watcher): update queue and state [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git rebase "origin/$branch"

            if git push origin "HEAD:$branch"; then
              exit 0
            fi

            echo "Push failed, retrying ($attempt/3)..."
            sleep 5
          done

          echo "Failed to push meta updates after 3 attempts."
          exit 1
